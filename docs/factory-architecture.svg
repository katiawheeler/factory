<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="factory-architecture-title factory-architecture-desc" id="factory-architecture-root">
      <title id="factory-architecture-title">How a factory run is wired</title>
      <desc id="factory-architecture-desc">The orchestrator skill dispatches stage agents and records every move through state.py, which reads the repo's factory settings and is the only writer of the run folder; agents commit in a per-run worktree that is pushed to a GitHub PR, whose CI and reviews come back to the orchestrator.</desc>
      <defs>
      <style>#factory-architecture-root { --color-paper:   #fcfcf2;
      --color-ink:     #463a14;
      --color-muted:   #6b6142;
      --color-accent:  #1b1bff;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #factory-architecture-root { font-family: var(--font-sans); color: var(--color-ink); }
      #factory-architecture-root .diagram-container { width: 100%; overflow-x: auto; }
      #factory-architecture-root .diagram-container { overflow-x: visible; }</style>
        <pattern id="factory-architecture-factory-architecture-dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="#463a14" fill-opacity="0.10"/>
        </pattern>
        <marker id="factory-architecture-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6b6142"/></marker>
        <marker id="factory-architecture-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#1b1bff"/></marker>
        <marker id="factory-architecture-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2f6b4f"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#fcfcf2"/>
      <rect width="100%" height="100%" fill="url(#factory-architecture-factory-architecture-dots)" opacity="0.55"/>

      <!-- Zones (before arrows and nodes) -->
      <rect x="192" y="96" width="400" height="304" rx="8" fill="#463a14" fill-opacity="0.02" stroke="#463a14" stroke-opacity="0.10" stroke-width="0.8"/>
      <rect x="204" y="100" width="72" height="12" rx="2" fill="#fcfcf2"/>
      <text x="240" y="109" fill="#706646" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">THE SKILL</text>

      <rect x="616" y="96" width="168" height="424" rx="8" fill="#463a14" fill-opacity="0.02" stroke="#463a14" stroke-opacity="0.10" stroke-width="0.8"/>
      <rect x="628" y="100" width="96" height="12" rx="2" fill="#fcfcf2"/>
      <text x="676" y="109" fill="#706646" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">YOUR REPOSITORY</text>

      <!-- Arrows (behind boxes) -->
      <!-- Human -> orchestrator, and the checkpoints coming back -->
      <line x1="136" y1="148" x2="216" y2="148" stroke="#6b6142" stroke-width="1.2" marker-end="url(#factory-architecture-arrow)"/>
      <line x1="216" y1="172" x2="136" y2="172" stroke="#6b6142" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#factory-architecture-arrow)"/>
      <!-- Orchestrator -> stage agents -->
      <line x1="360" y1="160" x2="432" y2="160" stroke="#6b6142" stroke-width="1.2" marker-end="url(#factory-architecture-arrow)"/>
      <!-- Orchestrator -> state.py (headline path) -->
      <line x1="288" y1="192" x2="288" y2="304" stroke="#1b1bff" stroke-width="1.4" marker-end="url(#factory-architecture-arrow-accent)"/>
      <!-- GitHub -> orchestrator: CI and reviews, read by the land stage -->
      <path d="M 880,128 V 80 Q 880,72 872,72 H 296 Q 288,72 288,80 V 128" fill="none" stroke="#2f6b4f" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#factory-architecture-arrow-link)"/>
      <!-- Stage agents -> worktree -->
      <line x1="576" y1="160" x2="632" y2="160" stroke="#6b6142" stroke-width="1.2" marker-end="url(#factory-architecture-arrow)"/>
      <!-- Worktree -> GitHub -->
      <line x1="768" y1="160" x2="840" y2="160" stroke="#2f6b4f" stroke-width="1.2" marker-end="url(#factory-architecture-arrow-link)"/>
      <!-- Stage agents -> run folder -->
      <path d="M 504,192 V 444 Q 504,452 512,452 H 632" fill="none" stroke="#6b6142" stroke-width="1.2" marker-end="url(#factory-architecture-arrow)"/>
      <!-- Settings -> state.py, hopping the stage-agents line -->
      <path d="M 632,336 H 512 a 8,8 0 0,0 -16,0 H 360" fill="none" stroke="#6b6142" stroke-width="1" marker-end="url(#factory-architecture-arrow)"/>
      <!-- state.py -> run folder -->
      <path d="M 288,368 V 468 Q 288,476 296,476 H 632" fill="none" stroke="#6b6142" stroke-width="1.2" marker-end="url(#factory-architecture-arrow)"/>

      <!-- Arrow labels -->
      <rect x="150" y="128" width="52" height="12" rx="2" fill="#fcfcf2"/>
      <text x="176" y="137" fill="#6b6142" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">/FACTORY</text>

      <rect x="144" y="180" width="64" height="12" rx="2" fill="#fcfcf2"/>
      <text x="176" y="189" fill="#6b6142" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">CHECKPOINTS</text>

      <rect x="370" y="140" width="52" height="12" rx="2" fill="#fcfcf2"/>
      <text x="396" y="149" fill="#6b6142" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">DISPATCH</text>

      <rect x="296" y="242" width="48" height="12" rx="2" fill="#fcfcf2"/>
      <text x="320" y="251" fill="#1b1bff" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">ADVANCE</text>

      <rect x="548" y="52" width="72" height="12" rx="2" fill="#fcfcf2"/>
      <text x="584" y="61" fill="#2f6b4f" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">CI · REVIEWS</text>

      <rect x="582" y="140" width="44" height="12" rx="2" fill="#fcfcf2"/>
      <text x="604" y="149" fill="#6b6142" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">COMMITS</text>

      <rect x="776" y="140" width="56" height="12" rx="2" fill="#fcfcf2"/>
      <text x="804" y="149" fill="#2f6b4f" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">PUSH · PR</text>

      <rect x="512" y="250" width="44" height="12" rx="2" fill="#fcfcf2"/>
      <text x="534" y="259" fill="#6b6142" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">OUTPUTS</text>

      <rect x="392" y="316" width="56" height="12" rx="2" fill="#fcfcf2"/>
      <text x="420" y="325" fill="#6b6142" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">FACTORY.*</text>

      <rect x="336" y="456" width="64" height="12" rx="2" fill="#fcfcf2"/>
      <text x="368" y="465" fill="#6b6142" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">STATE.JSON</text>

      <!-- Node: Human (input) -->
      <rect x="40" y="128" width="96" height="64" rx="6" fill="#fcfcf2"/>
      <rect x="40" y="128" width="96" height="64" rx="6" fill="#6b6142" fill-opacity="0.10" stroke="#706646" stroke-width="1"/>
      <rect x="48" y="136" width="28" height="12" rx="2" fill="none" stroke="#706646" stroke-opacity="0.40" stroke-width="0.8"/>
      <text x="62" y="145" fill="#706646" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">YOU</text>
      <text x="88" y="166" fill="#463a14" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Human</text>
      <text x="88" y="182" fill="#6b6142" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">or a CI job</text>

      <!-- Node: Orchestrator (backend) -->
      <rect x="216" y="128" width="144" height="64" rx="6" fill="#fcfcf2"/>
      <rect x="216" y="128" width="144" height="64" rx="6" fill="#ffffff" stroke="#463a14" stroke-width="1"/>
      <rect x="224" y="136" width="36" height="12" rx="2" fill="none" stroke="#463a14" stroke-opacity="0.40" stroke-width="0.8"/>
      <text x="242" y="145" fill="#463a14" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">AGENT</text>
      <text x="288" y="166" fill="#463a14" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Orchestrator</text>
      <text x="288" y="182" fill="#6b6142" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">SKILL.md · guides/</text>

      <!-- Node: Stage agents (backend) -->
      <rect x="432" y="128" width="144" height="64" rx="6" fill="#fcfcf2"/>
      <rect x="432" y="128" width="144" height="64" rx="6" fill="#ffffff" stroke="#463a14" stroke-width="1"/>
      <rect x="440" y="136" width="36" height="12" rx="2" fill="none" stroke="#463a14" stroke-opacity="0.40" stroke-width="0.8"/>
      <text x="458" y="145" fill="#463a14" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">AGENT</text>
      <text x="504" y="166" fill="#463a14" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Stage agents</text>
      <text x="504" y="182" fill="#6b6142" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">stages/*.md</text>

      <!-- Node: state.py (focal) -->
      <rect x="216" y="304" width="144" height="64" rx="6" fill="#fcfcf2"/>
      <rect x="216" y="304" width="144" height="64" rx="6" fill="#1b1bff" fill-opacity="0.06" stroke="#1b1bff" stroke-width="1"/>
      <rect x="224" y="312" width="36" height="12" rx="2" fill="none" stroke="#1b1bff" stroke-opacity="0.50" stroke-width="0.8"/>
      <text x="242" y="321" fill="#1b1bff" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">STATE</text>
      <text x="288" y="342" fill="#463a14" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">State helper</text>
      <text x="288" y="358" fill="#6b6142" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">scripts/state.py</text>

      <!-- Node: Run worktree (store) -->
      <rect x="632" y="128" width="136" height="64" rx="6" fill="#fcfcf2"/>
      <rect x="632" y="128" width="136" height="64" rx="6" fill="#463a14" fill-opacity="0.05" stroke="#6b6142" stroke-width="1"/>
      <rect x="640" y="136" width="28" height="12" rx="2" fill="none" stroke="#6b6142" stroke-opacity="0.50" stroke-width="0.8"/>
      <text x="654" y="145" fill="#6b6142" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">GIT</text>
      <text x="700" y="166" fill="#463a14" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Run worktree</text>
      <text x="700" y="182" fill="#6b6142" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">factory/&lt;id&gt; branch</text>

      <!-- Node: Settings (store) -->
      <rect x="632" y="304" width="136" height="64" rx="6" fill="#fcfcf2"/>
      <rect x="632" y="304" width="136" height="64" rx="6" fill="#463a14" fill-opacity="0.05" stroke="#6b6142" stroke-width="1"/>
      <rect x="640" y="312" width="28" height="12" rx="2" fill="none" stroke="#6b6142" stroke-opacity="0.50" stroke-width="0.8"/>
      <text x="654" y="321" fill="#6b6142" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">CFG</text>
      <text x="700" y="342" fill="#463a14" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Settings</text>
      <text x="700" y="358" fill="#6b6142" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">git config factory.*</text>

      <!-- Node: Run folder (store) -->
      <rect x="632" y="432" width="136" height="64" rx="6" fill="#fcfcf2"/>
      <rect x="632" y="432" width="136" height="64" rx="6" fill="#463a14" fill-opacity="0.05" stroke="#6b6142" stroke-width="1"/>
      <rect x="640" y="440" width="28" height="12" rx="2" fill="none" stroke="#6b6142" stroke-opacity="0.50" stroke-width="0.8"/>
      <text x="654" y="449" fill="#6b6142" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">DIR</text>
      <text x="700" y="470" fill="#463a14" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Run folder</text>
      <text x="700" y="486" fill="#6b6142" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">.factory/runs/&lt;id&gt;/</text>

      <!-- Node: GitHub (external) -->
      <rect x="840" y="128" width="80" height="64" rx="6" fill="#fcfcf2"/>
      <rect x="840" y="128" width="80" height="64" rx="6" fill="#463a14" fill-opacity="0.03" stroke="#463a14" stroke-opacity="0.30" stroke-width="1"/>
      <rect x="848" y="136" width="28" height="12" rx="2" fill="none" stroke="#463a14" stroke-opacity="0.22" stroke-width="0.8"/>
      <text x="862" y="145" fill="#706646" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
      <text x="880" y="166" fill="#463a14" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">GitHub</text>
      <text x="880" y="182" fill="#6b6142" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">PR · CI</text>

      <!-- Callout (bottom-left margin) -->
      <path d="M 120,424 Q 132,352 212,344" fill="none" stroke="#1b1bff" stroke-opacity="0.50" stroke-width="1" stroke-dasharray="4,3"/>
      <circle cx="214" cy="344" r="2" fill="#1b1bff"/>
      <text x="40" y="444" fill="#1b1bff" font-size="14" font-style="italic" font-family="'Instrument Serif', serif">The only writer of run state:</text>
      <text x="40" y="462" fill="#1b1bff" font-size="14" font-style="italic" font-family="'Instrument Serif', serif">it enforces stage order,</text>
      <text x="40" y="480" fill="#1b1bff" font-size="14" font-style="italic" font-family="'Instrument Serif', serif">skips, and locks.</text>

      <!-- Legend strip -->
      <line x1="40" y1="540" x2="920" y2="540" stroke="#463a14" stroke-opacity="0.10" stroke-width="0.8"/>
      <text x="40" y="556" fill="#6b6142" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="40" y="572" width="14" height="10" rx="2" fill="#1b1bff" fill-opacity="0.06" stroke="#1b1bff" stroke-width="1"/>
      <text x="60" y="580" fill="#6b6142" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Focal</text>

      <rect x="112" y="572" width="14" height="10" rx="2" fill="#ffffff" stroke="#463a14" stroke-width="1"/>
      <text x="132" y="580" fill="#6b6142" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Agent</text>

      <rect x="184" y="572" width="14" height="10" rx="2" fill="#463a14" fill-opacity="0.05" stroke="#6b6142" stroke-width="1"/>
      <text x="204" y="580" fill="#6b6142" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Local state</text>

      <rect x="284" y="572" width="14" height="10" rx="2" fill="#463a14" fill-opacity="0.03" stroke="#463a14" stroke-opacity="0.30" stroke-width="1"/>
      <text x="304" y="580" fill="#6b6142" font-size="8.5" font-family="'Geist', system-ui, sans-serif">External</text>

      <rect x="368" y="572" width="14" height="10" rx="2" fill="#6b6142" fill-opacity="0.10" stroke="#706646" stroke-width="1"/>
      <text x="388" y="580" fill="#6b6142" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Person</text>

      <line x1="448" y1="577" x2="476" y2="577" stroke="#1b1bff" stroke-width="1.4" marker-end="url(#factory-architecture-arrow-accent)"/>
      <text x="484" y="580" fill="#6b6142" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Every stage move</text>

      <line x1="584" y1="577" x2="612" y2="577" stroke="#2f6b4f" stroke-width="1.2" marker-end="url(#factory-architecture-arrow-link)"/>
      <text x="620" y="580" fill="#6b6142" font-size="8.5" font-family="'Geist', system-ui, sans-serif">GitHub</text>

      <line x1="680" y1="577" x2="708" y2="577" stroke="#6b6142" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#factory-architecture-arrow)"/>
      <text x="716" y="580" fill="#6b6142" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Return / async</text>
    </svg>
